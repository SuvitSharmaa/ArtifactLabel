pipeline:
  name: PodLogsRepro
  identifier: PodLogsRepro
  projectIdentifier: p1
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: PodLogsRepro
        identifier: PodLogsRepro
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: PodLogsRepro
          environment:
            environmentRef: PodLogsRepro
            deployToAll: false
            infrastructureDefinitions:
              - identifier: PodLogsRepro
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
