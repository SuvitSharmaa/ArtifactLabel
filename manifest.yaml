apiVersion: v1
kind: Namespace
metadata:
  name: pod-logs-repro
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stuck-readiness-repro
  namespace: pod-logs-repro
  labels:
    app: stuck-readiness-repro
spec:
  replicas: 1
  progressDeadlineSeconds: 180  # tune this to control how fast it fails
  selector:
    matchLabels:
      app: stuck-readiness-repro
  template:
    metadata:
      labels:
        app: stuck-readiness-repro
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          readinessProbe:
            exec:
              # always exits non-zero, so the pod is Running but never Ready
              command: ["sh", "-c", "exit 1"]
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 1
